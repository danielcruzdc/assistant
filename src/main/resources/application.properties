spring.application.name=assistant

# LLM Configuration (LM Studio)
spring.ai.openai.base-url=http://localhost:1235/
spring.ai.openai.api-key=dummy


# Chat Model
spring.ai.openai.chat.options.model=google/gemma-4-e2b

# Database Configuration (Docker setup)
spring.datasource.url=jdbc:postgresql://localhost:5432/assistant
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

spring.main.allow-bean-definition-overriding=true

spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always

# Embedding Model
spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v1.5
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB